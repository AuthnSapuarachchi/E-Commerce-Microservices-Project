server:
  port: 9000

spring:
  application:
    name: api-gateway

  # 1. Connect to Redis (For Rate Limiting)
  data:
    redis:
      host: localhost
      port: 6379

  # 2. Security (Keycloak)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/shopwise-realm

  cloud:
    gateway:
      # 3. CORS - Allow Frontend to talk to Gateway
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # 4. Routes - The Traffic Map
      routes:
        # Route 1: Product Service
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/product/**
          filters:
            # Rate Limiting Filter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # Route 2: Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/order/**

        # Route 3: Inventory Service
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

# 5. Service Discovery (CRITICAL MISSING PART)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}


# 6. Logging (Optional but Recommended)
logging:
  level:
    org.springframework.cloud.gateway: INFO