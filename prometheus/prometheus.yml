global:
  scrape_interval: 10s # Collect data every 10 seconds

scrape_configs:
  - job_name: "order_service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      # CRITICAL: Since Order Service runs in IntelliJ (Host),
      # we use 'host.docker.internal' so Docker can see Windows.
      - targets: ["host.docker.internal:8081"]
        labels:
          application: "Order Service"
